<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfolio</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Portfolio">
<meta name="theme-color" content="#1A2468">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=DM+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<script>/* Change this one word to switch the look: 'b' = dark and bold, 'a' = light Sunrise. */
var THEME_DEFAULT='b';
var mqL=window.matchMedia&&matchMedia('(prefers-color-scheme: light)');
function setThemeAuto(){ var light=!!(mqL&&mqL.matches); document.documentElement.setAttribute('data-theme',light?'a':THEME_DEFAULT);
  try{ var m=document.querySelector('meta[name=theme-color]'); if(m) m.setAttribute('content',light?'#4A32B0':'#0B1220'); }catch(e){} }
setThemeAuto(); try{ if(mqL&&mqL.addEventListener) mqL.addEventListener('change',setThemeAuto); }catch(e){}
window.addEventListener('scroll',function(){ document.documentElement.classList.toggle('sc',window.scrollY>6) },{passive:true});</script>
<style>
  :root{
    --paper:#F4F5FA; --card:#FFFFFF; --ink:#141B2D; --mute:#667089; --line:#E5E8F1;
    --indigo:#27348B; --indigo-deep:#1A2468; --marigold-bg:#FFF3D6; --marigold-ink:#8A5A00;
    --gain:#0A8A55; --gain-bg:#E1F5EA; --loss:#CF3A3A; --loss-bg:#FCE8E8;
    --on-indigo-mute:rgba(255,255,255,.72); --chip:rgba(255,255,255,.14);
    --gain-light:#6EE7A8; --loss-light:#FFA3A3; --nav-on:#27348B; --nav-on-bg:#E8EBF7;
  }
  @media (prefers-color-scheme:dark){:root{
    --paper:#0D1120; --card:#171C2F; --ink:#ECEFF8; --mute:#98A2BD; --line:#272E47;
    --indigo:#222C7C; --indigo-deep:#161D55; --marigold-bg:#3B2E0E; --marigold-ink:#F8CE7A;
    --gain:#3DD68C; --gain-bg:#12372A; --loss:#FF8080; --loss-bg:#431B1E;
    --nav-on:#C6D0FF; --nav-on-bg:#232C52;
  }}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:var(--paper)}
  body{margin:0;color:var(--ink);font:500 17px/1.42 Manrope,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       -webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums lining-nums}
  button,select{font:inherit;color:inherit}
  button{background:none;border:0;padding:0;cursor:pointer;text-align:left}
  button:focus-visible,select:focus-visible{outline:2px solid #F5A524;outline-offset:2px}
  .wrap{max-width:620px;margin:0 auto}

  body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);background:var(--paper);z-index:60;opacity:0;transition:opacity .15s;pointer-events:none}
  html.sc body::before{opacity:1}
  .mkt{flex:1;min-width:0;text-align:center;font-size:11px;font-weight:700;color:var(--on-indigo-mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mkt[hidden]{display:block;visibility:hidden}
  .idr{display:flex;align-items:center;gap:8px;flex:none}
  .bell{position:relative;width:28px;height:28px;border-radius:50%;background:var(--chip);display:grid;place-items:center;color:inherit}
  .bell svg{width:15px;height:15px}
  .bell i{position:absolute;top:3px;right:4px;width:7px;height:7px;border-radius:50%;background:#F5A524;box-shadow:0 0 0 1.5px var(--indigo)}
  html[data-theme=b] .mkt{color:#8FA0C0}
  nav.many button{font-size:10.2px;padding:7px 0 6px}
  .band{background:linear-gradient(170deg,var(--indigo) 0%,var(--indigo-deep) 100%);color:#fff;
        border-radius:0 0 26px 26px;padding:calc(14px + env(safe-area-inset-top)) 0 20px}
  .who{position:sticky;top:0;z-index:12;background:var(--indigo-deep);color:#fff;
       padding:calc(7px + env(safe-area-inset-top)) 18px 7px;display:flex;align-items:center;gap:9px;
       box-shadow:0 1px 0 rgba(255,255,255,.14)}
  .who .dot{width:9px;height:9px;border-radius:50%;background:var(--gain-light);flex:none}
  .who .nm2{font-size:14.5px;font-weight:800;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .who .rl{margin-left:auto;flex:none;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;
           background:rgba(255,255,255,.18);padding:3px 9px;border-radius:999px}
  .top{display:flex;align-items:center;justify-content:space-between;padding:0 18px;gap:11px}
  .top .ttl{min-width:0;flex:1}
  .top h1,.top .when{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .top h1{font-size:18px;font-weight:800;margin:0;letter-spacing:-.01em}
  .top .when{font-size:11.5px;color:var(--on-indigo-mute)}
  .refresh{width:40px;height:40px;border-radius:50%;background:var(--chip);display:grid;place-items:center;flex:none}
  .refresh svg{width:18px;height:18px}
  .refresh.spin svg{animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.refresh.spin svg{animation:none}}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:12px 18px 2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;padding:7px 14px;border-radius:999px;background:var(--chip);font-weight:700;font-size:13px;white-space:nowrap}
  .chip.on{background:#fff;color:var(--indigo-deep)}
  .hero{padding:16px 18px 0}
  .hero .cap{font-size:12.5px;color:var(--on-indigo-mute);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hero .fig{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:2px 0 0}
  .heroTop{display:flex;align-items:flex-end;justify-content:space-between;gap:14px}
  .hv{min-width:0;flex:1}
  .hd{flex:none;text-align:right}
  .hd .lab{font-size:11px;color:var(--on-indigo-mute);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
  .hd .amt{font-size:25px;font-weight:800;letter-spacing:-.02em;line-height:1.15;white-space:nowrap;margin-top:2px}
  .hd .pc{font-size:12.5px;font-weight:700;opacity:.85;white-space:nowrap}
  .hd .g{color:var(--gain-light)} .hd .l{color:var(--loss-light)}
  .today{margin-top:12px;background:rgba(255,255,255,.12);border-radius:14px;padding:11px 14px;display:flex;
         align-items:center;justify-content:space-between;gap:12px}
  .today .lab{font-size:12.5px;color:var(--on-indigo-mute);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
  .today .amt{font-size:25px;font-weight:800;letter-spacing:-.02em;line-height:1.1;text-align:right}
  .today .pc{font-size:13px;font-weight:700;opacity:.85}
  .today .g{color:var(--gain-light)} .today .l{color:var(--loss-light)}
  .tot{margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.18);display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  .tot span{font-size:13px;color:var(--on-indigo-mute);font-weight:600}
  .tot b{font-size:21px;font-weight:800}
  .back{display:inline-block;font-weight:700;color:#fff;padding:6px 18px 0;font-size:14px}

  main{padding:4px 14px calc(96px + env(safe-area-inset-bottom))}
  h2{font-size:16.5px;font-weight:800;margin:22px 4px 8px;letter-spacing:-.01em;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  h2 small{font-weight:600;color:var(--mute);font-size:12.5px;white-space:nowrap}
  .card{background:var(--card);border-radius:18px;padding:4px 16px;margin-top:14px;box-shadow:0 1px 0 var(--line)}
  .ml{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
  .ml:first-child{border-top:0}
  .ml .k{font-weight:600}
  .ml .v{font-weight:800;font-size:18.5px;white-space:nowrap;text-align:right}
  .ml.total{border-top:2px solid var(--ink)}
  .ml.total .v{font-size:22px}
  .ml .v .pcline{display:block;font-size:12.5px;font-weight:600;color:var(--mute);margin-top:2px}
  .cap-red{color:var(--loss)} .up{color:var(--gain)} .dn{color:var(--loss)}
  .banner{background:var(--gain-bg);color:var(--gain);border-radius:14px;padding:12px 14px;margin:13px 0;font-weight:700;line-height:1.35}
  .banner b{display:block;font-size:17px;font-weight:800;margin-top:2px}
  .note{background:var(--marigold-bg);color:var(--marigold-ink);border-radius:14px;padding:11px 14px;font-size:13px;margin-top:14px;font-weight:600}
  .note ul{margin:8px 0 0;padding-left:18px;font-weight:500}
  .note summary{cursor:pointer}

  .list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
  .item{display:block;width:100%;background:var(--card);border-radius:16px;padding:13px 15px;box-shadow:0 1px 0 var(--line)}
  button.item:active{background:var(--paper)}
  .head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .nm{min-width:0;flex:1}
  .nm .t{font-weight:800;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nm .s{color:var(--mute);font-size:13.5px;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .head .vv{text-align:right;flex:none}
  .head .vv .t{font-weight:800;font-size:19px;white-space:nowrap;letter-spacing:-.01em}
  .head .vv .s{font-size:12.5px;color:var(--mute);margin-top:1px;white-space:nowrap}
  .head .vv .s.up{color:var(--gain)}
  .head .vv .s.dn{color:var(--loss)}
  .mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:11px;padding-top:11px;border-top:1px solid var(--line)}
  .mini span{display:block;font-size:11.5px;color:var(--mute);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mini b{display:block;font-size:16.5px;font-weight:800;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .flag{display:inline-block;margin-top:10px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--gain-bg);color:var(--gain)}
  .inact{margin:18px 4px 8px;font-size:12px;font-weight:700;color:var(--marigold-ink);opacity:.85}
  .tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;background:var(--marigold-bg);color:var(--marigold-ink);margin-left:6px;vertical-align:1px}
  .idrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 18px 9px}
  .idrow .rolep{flex:none;font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
                background:rgba(255,255,255,.2);padding:4px 11px;border-radius:999px}
  .idrow .namep{flex:none;font-size:14px;font-weight:800;letter-spacing:.01em;
                max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .acctbox{flex:none;max-width:46%;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.32);
           border-radius:999px;padding:8px 15px;margin-left:auto;font-size:16px;font-weight:800;
           letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .acctbox:empty{display:none}
  .sugwrap{margin-top:8px;display:flex;flex-direction:column;gap:7px}
  .sugr{display:block;width:100%;text-align:left;background:var(--card);border-radius:12px;padding:10px 13px;
        box-shadow:0 1px 0 var(--line)}
  .sugr .mt{font-weight:800;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sugr .ms{font-size:12px;color:var(--mute);font-weight:600;margin-top:2px}
  .sw{display:flex;align-items:center;gap:10px;margin:14px 4px 0;font-size:13.5px;font-weight:700;color:var(--mute)}
  .sw button{margin-left:auto;width:50px;height:29px;border-radius:999px;background:var(--line);position:relative;flex:none}
  .sw button.on{background:var(--indigo)}
  .sw button i{position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;background:#fff;
               transition:transform .15s;display:block}
  .sw button.on i{transform:translateX(21px)}
  .drow{display:flex;justify-content:space-between;gap:12px;margin-top:9px;font-size:14.5px}
  .drow span{color:var(--mute);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .drow b{font-weight:800;white-space:nowrap}
  .dsep{border-top:1px solid var(--line);margin-top:11px;padding-top:2px}
  .fab{position:fixed;right:16px;bottom:calc(80px + env(safe-area-inset-bottom));z-index:11;width:56px;height:56px;
       border-radius:50%;background:var(--indigo);color:#fff;display:grid;place-items:center;
       box-shadow:0 6px 18px rgba(26,36,104,.4);font-size:31px;font-weight:300;line-height:1;padding-bottom:3px}
  .sheet{position:fixed;inset:0;z-index:20;background:var(--paper);overflow-y:auto;
         padding:calc(16px + env(safe-area-inset-top)) 16px calc(30px + env(safe-area-inset-bottom))}
  .sheet .hd2{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .sheet h3{font-size:21px;font-weight:800;margin:0}
  .sheet .cls{font-size:15px;font-weight:800;color:var(--mute);padding:6px}
  .seg{display:flex;gap:8px;margin:16px 0 2px}
  .seg button{flex:1;padding:13px;border-radius:14px;background:var(--card);font-weight:800;text-align:center;
              box-shadow:0 1px 0 var(--line);font-size:15px}
  .seg button.on{background:var(--indigo);color:#fff;box-shadow:none}
  .fld{margin-top:14px}
  .fld label{display:block;font-size:12.5px;font-weight:700;color:var(--mute);margin-bottom:6px}
  .fld input,.fld select{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;
                         padding:13px 12px;font-size:16px;font-weight:600;color:var(--ink)}
  .hint{font-size:12.5px;color:var(--mute);font-weight:600;margin-top:6px}
  .amt2{margin-top:16px;background:var(--card);border-radius:14px;padding:13px 15px;display:flex;
        justify-content:space-between;align-items:center;box-shadow:0 1px 0 var(--line);font-weight:700}
  .amt2 b{font-size:21px;font-weight:800}
  .btnrow{display:flex;gap:10px;margin-top:18px}
  .btn{flex:1;padding:15px;border-radius:14px;font-weight:800;text-align:center;font-size:15px}
  .btn.primary{background:var(--indigo);color:#fff}
  .btn.ghost{background:var(--card);box-shadow:0 1px 0 var(--line)}
  .err{background:var(--loss-bg);color:var(--loss);border-radius:12px;padding:12px 14px;margin-top:14px;font-weight:700;font-size:14px}
  .okmsg{background:var(--gain-bg);color:var(--gain);border-radius:12px;padding:12px 14px;margin-top:14px;font-weight:700;font-size:14px}
  .sumbox{background:var(--card);border-radius:16px;padding:4px 16px;margin-top:16px;box-shadow:0 1px 0 var(--line)}
  .mrow{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);
        border-radius:14px;padding:11px 14px;margin-top:8px;box-shadow:0 1px 0 var(--line)}
  .mrow .mt{min-width:0;font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mrow .ms{font-size:12px;color:var(--mute);font-weight:600;margin-top:2px}
  .mrow .x{flex:none;color:var(--loss);font-weight:800;font-size:13px;padding:6px 4px}
  .tools{display:flex;gap:8px;margin-top:12px}
  select,.srch{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px;font-size:14.5px;font-weight:600;color:var(--ink)}
  .srch::placeholder{color:var(--mute);font-weight:500}
  .more{display:block;margin:12px auto 0;padding:9px 18px;border-radius:999px;background:var(--card);font-weight:700;font-size:13px;box-shadow:0 1px 0 var(--line)}
  .empty{color:var(--mute);padding:22px 16px;text-align:center;font-size:14px;background:var(--card);border-radius:16px}
  .center{text-align:center;padding:70px 24px;color:var(--mute)}
  .tx{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 15px;border-top:1px solid var(--line)}
  .tx:first-child{border-top:0}
  .tx .txl{min-width:0;flex:1}
  .tx .txr{flex:none;text-align:right}
  .tx .t{font-weight:800;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tx .s{font-size:13px;color:var(--mute);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tx .txr .t{font-size:17px}
  .scope{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--marigold-bg);
         color:var(--marigold-ink);border-radius:14px;padding:10px 14px;margin-top:12px;font-size:13px;font-weight:600}
  .scope button{font-weight:800;text-decoration:underline;white-space:nowrap;color:inherit;flex:none}
  .txwrap{background:var(--card);border-radius:16px;overflow:hidden;margin-top:12px;box-shadow:0 1px 0 var(--line)}
  .buy,.sell{font-size:11px;font-weight:800;padding:1px 6px;border-radius:5px;margin-right:6px}
  .buy{background:var(--line);color:var(--mute)} .sell{background:var(--gain-bg);color:var(--gain)}

  nav{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--card);border-top:1px solid var(--line);
      padding:7px 6px calc(7px + env(safe-area-inset-bottom))}
  nav .in{max-width:620px;margin:0 auto;display:flex;gap:4px}
  nav button{flex:1;text-align:center;padding:7px 2px 6px;border-radius:14px;font-size:11.5px;font-weight:700;color:var(--mute);
             position:relative;transition:background .12s}
  nav button svg{display:block;margin:0 auto 3px;width:21px;height:21px;stroke-width:2}
  nav button.on{color:var(--nav-on);background:var(--nav-on-bg);font-weight:800}
  nav button.on svg{stroke-width:2.6}
  nav button.on::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:26px;height:3px;
                        border-radius:0 0 3px 3px;background:var(--nav-on)}

  /* ===== THEMES. Colours and shapes only; no content. Default is set by THEME_DEFAULT in the script (b = dark bold, a = light Sunrise). ===== */
  html[data-theme=b]{--paper:#0B1220;--card:#15203A;--ink:#E8EEF9;--mute:#8FA0C0;--line:#22304D;
    --indigo:#2DD4BF;--indigo-deep:#0B1220;--marigold-bg:#33290F;--marigold-ink:#F5B83D;
    --gain:#2DD4BF;--gain-bg:#0F2E2C;--loss:#FF7A6B;--loss-bg:#33171A;--on-indigo-mute:#8FA0C0;--chip:#18233A;
    --gain-light:#2DD4BF;--loss-light:#FF7A6B;--nav-on:#F5B83D;--nav-on-bg:#1B2540;color-scheme:dark}
  html[data-theme=a]{--paper:#FFFBF2;--card:#FFFFFF;--ink:#241B3D;--mute:#7A7290;--line:#EFE6D3;
    --indigo:#5B3FD1;--indigo-deep:#4A32B0;--marigold-bg:#FFEFC9;--marigold-ink:#7A4D00;
    --gain:#0E8F5B;--gain-bg:#DDF5E8;--loss:#D6403A;--loss-bg:#FCE6E4;--on-indigo-mute:rgba(255,255,255,.78);--chip:rgba(255,255,255,.16);
    --gain-light:#7CF0B4;--loss-light:#FFB0A8;--nav-on:#5B3FD1;--nav-on-bg:#EFEAFF;color-scheme:light}
  html[data-theme=b] body{font-family:"Space Grotesk",Manrope,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:-.005em}
  html[data-theme=a] body{font-family:"DM Sans",Manrope,-apple-system,"Segoe UI",Roboto,sans-serif}
  html[data-theme=b] .band,html[data-theme=a] .band{border-radius:0 0 22px 22px}
  html[data-theme=b] .band{background:var(--paper);padding-bottom:16px}
  html[data-theme=a] .band{background:linear-gradient(170deg,#5B3FD1 0%,#4A32B0 100%)}
  html[data-theme=b] .who{background:#0A101D;box-shadow:0 1px 0 #1E2B45}
  html[data-theme=b] .who .rl,html[data-theme=b] .idrow .rolep{background:transparent;color:#F5B83D;border:1px solid #F5B83D66}
  html[data-theme=b] .acctbox{background:#18233A;border-color:#2DD4BF66;color:#E8EEF9}
  html[data-theme=b] .chip.on{background:#2DD4BF;color:#06231F}

<script>
var ENDPOINT = 'https://script.google.com/macros/s/AKfycbyqaykcSwQJtwtWut4icKtaDPVPhlb1Qd00-KDEHynRwGMbQ5O_tFazi5FiQ95W_Qg/exec';
var KEY = (function () {
  var m = /[?&#]k=([A-Za-z0-9]+)/.exec(location.search) || /[?&#]k=([A-Za-z0-9]+)/.exec(location.hash);
  if (m) { try { localStorage.setItem('pfkey', m[1]); } catch (e) {} return m[1]; }
  try { return localStorage.getItem('pfkey') || ''; } catch (e) { return ''; }
})();
var D=null, tab='overview', sel=-1, stock=-1, q='', limit=25, loadedAt=0;
var SORTS={holdings:'day_desc',profit:'profit_desc'}, sortKey='day_desc', detail=false;
var ICON={
  overview:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>',
  holdings:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M9 10v10"/></svg>',
  profit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg>',
  broker:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>',
  history:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></svg>'};
var TABS=[['overview','Overview'],['holdings','Holdings'],['profit','Profit'],['history','History']];

var BP=null, bpTimer=null, bpMsg='', bpOk=true, bpBusy=false, bpDups=[], bpAngel={pin:'',totp:''}, bpSetup=false;
var BOOT={}; try{ var be=document.getElementById('boot'); BOOT=JSON.parse(be&&be.getAttribute('data-b')||'{}')||{}; }catch(e){ BOOT={}; }
if(BOOT.start==='broker'){ tab='broker'; bpMsg=BOOT.note||''; bpOk=BOOT.ok!==false; }
function tabList(){ return master()?TABS.concat([['ipo','IPO'],['broker','Brokers']]):TABS }
function gsr(){ return typeof google!=='undefined'&&google.script&&google.script.run }
function isDemo(){ return !gsr()&&!!(D&&D.demo) }
function typing(){ var a=document.activeElement; return !!(a&&a.tagName==='INPUT') }
function bcall(fn,args,params,cb){
  if(gsr()){ var r=google.script.run.withSuccessHandler(function(t){ cb(JSON.parse(t)) }).withFailureHandler(function(e){ cb({error:String(e&&e.message||e)}) }); r[fn].apply(r,[KEY].concat(args)); }
  else api(params,cb);
}
function bpDemo(){ return {accounts:[{name:'VIP',broker:'Zerodha',client:'MAK905',keys:true,connected:true,until:'24 Nov, 6:00 AM',url:'#'},{name:'BVP',broker:'Zerodha',client:'CGV585',keys:true,connected:false,until:'',url:'#'},{name:'ANGEL',broker:'Angel One',client:'',keys:false,connected:false,until:'',url:'',need:'key'}],dups:0} }
var bpFastUntil=0, bpLastPoll=0, bpCached=false;
function bpLogin(el){ bpFastUntil=Date.now()+240000;
  try{ var w=window.open(el.href,'_blank'); if(w){ bpMsg='Finish the login in the window that opened. This page updates by itself when you are connected.'; bpOk=true; brokerScreen(); return false; } }catch(e){}
  return true; }
document.addEventListener('visibilitychange',function(){ if(!document.hidden&&tab==='broker'&&stock<0&&BP) brokerLoad(true); });
function brokerLoad(quiet){
  if(isDemo()){ BP=BP||bpDemo(); if(tab==='broker'&&stock<0) brokerScreen(); return; }
  var fast=Date.now()<bpFastUntil; bpLastPoll=Date.now();
  bcall('brokerPanel',[fast?1:0],fast?{action:'bpanel',fresh:1}:{action:'bpanel'},function(p){
    if(p.error){ if(!quiet){ bpMsg=p.error; bpOk=false; } BP=BP||{accounts:[],dups:0}; }
    else { var was=BP&&BP.accounts?BP.accounts.filter(function(a){return a.connected}).length:0, now=p.accounts.filter(function(a){return a.connected}).length;
      if(fast&&now>was){ bpMsg='Broker connected. Updated automatically.'; bpOk=true; bpFastUntil=0; }
      BP=p; try{ localStorage.setItem('bp_'+KEY,JSON.stringify(p)); }catch(e){} if(p.dups&&!bpDups.length) dupLoad(); if(!p.dups) bpDups=[]; }
    if(tab==='broker'&&stock<0&&!typing()) brokerScreen();
  });
}
function dupLoad(){ if(isDemo()) return; bcall('brokerDups',[],{action:'bdups'},function(r){ bpDups=r.error?[]:r; if(tab==='broker'&&stock<0&&!typing()) brokerScreen(); }); }
function dupDecide(id,choice){
  if(bpBusy) return; bpBusy=true; brokerScreen();
  bcall('brokerDupDecide',[id,choice],{action:'bdecide',id:id,choice:choice},function(r){ bpBusy=false;
    if(r.error){ bpMsg=r.error; bpOk=false } else { bpMsg=r.message; bpOk=true; bpDups=r.dups; if(BP) BP.dups=r.dups.length; } brokerScreen(); });
}
function brokerSync(){
  if(bpBusy) return; bpBusy=true; bpMsg='Syncing. This can take about a minute.'; bpOk=true; brokerScreen();
  if(isDemo()){ bpBusy=false; bpMsg=''; bpRes=[{account:'VIP',found:3,added:2,already:1,flagged:0,bse:0,bseList:[]}]; brokerScreen(); return; }
  bcall('brokerSyncNow',[],{action:'bsync'},function(r){ bpBusy=false;
    if(r.error){ bpMsg='Sync failed: '+r.error; bpOk=false; bpRes=null } else { bpRes=r.rows||[]; bpMsg=(bpRes.length?'':'No account is connected today. Log in first, then sync.')+(r.diffs?(bpRes.length?'':'\n\n')+r.diffs:''); bpOk=true; BP=r.panel; if(r.panel.dups) dupLoad(); }
    brokerScreen(); });
}
function angelSave(){
  var k=(document.getElementById('akey')||{}).value||'', c=(document.getElementById('acl')||{}).value||'';
  if(bpBusy) return; bpBusy=true; brokerScreen();
  bcall('angelSetup',[k,c],{action:'asetup',apikey:k,client:c},function(r){ bpBusy=false;
    if(r.error){ bpMsg=r.error; bpOk=false } else { bpMsg='Angel One details saved. Now enter your PIN and code to connect.'; bpOk=true; BP=r.panel; bpSetup=false; } brokerScreen(); });
}
function angelGo(){
  var pin=bpAngel.pin, totp=bpAngel.totp.replace(/\s/g,'');
  if(!pin){ bpMsg='Enter your Angel One PIN.'; bpOk=false; brokerScreen(); return; }
  if(!/^\d{6}$/.test(totp)){ bpMsg='Enter the 6-digit code from your Authenticator app.'; bpOk=false; brokerScreen(); return; }
  if(bpBusy) return; bpBusy=true; brokerScreen();
  function after(r){ bpBusy=false; bpAngel={pin:'',totp:''}; if(r.error){ bpMsg=r.error; bpOk=false } else { bpMsg=r.message; bpOk=true; BP=r.panel; } brokerScreen(); }
  if(isDemo()){ var p=bpDemo(); p.accounts[2]={name:'ANGEL',broker:'Angel One',client:'A123',keys:true,connected:true,until:'23 Nov, 11:59 PM',url:'',need:''}; after({message:'ANGEL is connected for today.',panel:p}); return; }
  if(gsr()){ google.script.run.withSuccessHandler(function(t){ after(JSON.parse(t)) }).withFailureHandler(function(e){ after({error:String(e&&e.message||e)}) }).angelConnect(KEY,pin,totp); return; }
  fetch(ENDPOINT,{method:'POST',body:JSON.stringify({action:'aconnect',k:KEY,pin:pin,totp:totp}),redirect:'follow'})
    .then(function(r){ return r.text() }).then(function(t){ after(JSON.parse(t)) })
    .catch(function(){ after({error:'Could not reach the sheet. Check your connection.'}) });
}
var bpRes=null;
function syncRes(){
  if(!bpRes||!bpRes.length) return '';
  var tot=bpRes.reduce(function(n,r){return n+(r.added||0)},0), fnd=bpRes.reduce(function(n,r){return n+(r.found||0)},0);
  var h='<h2>Last sync <small>'+fnd+' trade'+(fnd===1?'':'s')+' found, '+tot+' added</small></h2><div class="list">';
  bpRes.forEach(function(r){
    var cl=''; if(BP) BP.accounts.forEach(function(a){ if(a.name===r.account) cl=a.client||'' });
    var s;
    if(r.err) s='Could not sync: '+r.err;
    else if(!r.found) s='No trades today';
    else s=r.found+' trade'+(r.found===1?'':'s')+' found · <b>'+r.added+' added to Ledger</b>'+(r.already?' · '+r.already+' already there':'')+(r.flagged?' · '+r.flagged+' to check below':'');
    h+='<div class="item"><div class="nm"><div class="t">'+esc(r.account)+(cl?' · '+esc(cl):'')+'</div><div class="s" style="white-space:normal">'+(r.err?esc(s):s)+'</div>'+
      (r.bse?'<div class="s" style="white-space:normal;color:#C0392B;font-weight:700">'+r.bse+' trade'+(r.bse===1?'':'s')+' on BSE for a stock not in your Ledger yet: '+esc((r.bseList||[]).join(', '))+'. Add by hand.</div>':'')+'</div></div>';
  });
  return h+'</div>';
}
function brokerScreen(){
  document.getElementById('band').innerHTML='';
  document.getElementById('fab').innerHTML='';
  if(!bpTimer) bpTimer=setInterval(function(){ if(tab==='broker'&&stock<0&&!document.hidden&&!bpBusy&&(Date.now()<bpFastUntil||Date.now()-bpLastPoll>9000)) brokerLoad(true) },2500);
  if(!BP){ try{ var bc=localStorage.getItem('bp_'+KEY); if(bc){ BP=JSON.parse(bc); bpCached=true; } }catch(e){} }
  if(BP&&bpCached){ bpCached=false; setTimeout(function(){ brokerLoad(true) },50); }
  if(!BP){ document.getElementById('main').innerHTML=(bpMsg?'<div class="'+(bpOk?'okmsg':'err')+' pre">'+esc(bpMsg)+'</div>':'')+'<div class="center">Loading broker accounts</div>'; brokerLoad(); return; }
  var z=BP.accounts.filter(function(a){return a.broker==='Zerodha'}), an=BP.accounts.filter(function(a){return a.broker==='Angel One'})[0];
  var zn=z.filter(function(a){return a.connected}).length;
  var h=bpMsg?'<div class="'+(bpOk?'okmsg':'err')+' pre">'+esc(bpMsg)+'</div>':'';
  h+='<h2>Zerodha <small>'+zn+' of '+z.length+' connected today</small></h2>'+
    '<div class="note">Tap Log in and enter your Authenticator code. You come straight back here. If Zerodha shows a different user, tap Change user and enter the Client ID shown below.</div><div class="list">'+
    z.map(function(a){
      return '<div class="item"><div class="head"><div class="nm"><div class="t"><span class="dotc'+(a.connected?' on':'')+'"></span>'+esc(a.name)+'</div>'+
        '<div class="s">'+(a.client?'Client ID <b>'+esc(a.client)+'</b> · ':'')+(a.connected?'Connected':(a.keys?'Not logged in':'No keys saved'))+'</div></div>'+
        (a.url?'<a class="lbtn'+(a.connected?' ok':'')+'" href="'+esc(a.url)+'" target="_top" onclick="return bpLogin(this)">'+(a.connected?'Again':'Log in')+'</a>':'')+'</div></div>';
    }).join('')+'</div>';
  if(an){
    h+='<h2>Angel One <small>'+(an.connected?'connected today':'not connected')+'</small></h2><div class="card" style="padding:14px 16px">';
    if(an.need||bpSetup){
      h+='<div style="font-weight:800">One-time setup</div><div class="hint">Your SmartAPI app\'s API key (smartapi.angelone.in &gt; My Apps) and your Angel One client code.</div>'+
        '<div class="fld"><label>API key</label><input id="akey" autocomplete="off" autocapitalize="off" spellcheck="false"></div>'+
        '<div class="fld"><label>Client code</label><input id="acl" value="'+esc(an.client||'')+'" autocomplete="off" autocapitalize="characters"></div>'+
        '<div class="btnrow"><button class="btn primary" onclick="angelSave()">'+(bpBusy?'Saving...':'Save')+'</button>'+(an.need?'':'<button class="btn ghost" onclick="bpSetup=false;brokerScreen()">Cancel</button>')+'</div>';
    } else if(an.connected){
      h+='<div class="head"><div class="nm"><div class="t"><span class="dotc on"></span>'+esc(an.name)+'</div><div class="s">Client <b>'+esc(an.client)+'</b> · Connected until '+esc(an.until)+'</div></div></div>';
    } else {
      h+='<div class="t" style="font-weight:800"><span class="dotc"></span>'+esc(an.name)+' <span style="color:var(--mute);font-weight:600;font-size:13px">Client '+esc(an.client)+'</span></div>'+
        '<form onsubmit="angelGo();return false" autocomplete="on"><input type="text" name="username" value="'+esc(an.client)+'" autocomplete="username" style="display:none">'+
        '<div class="fld"><label>PIN</label><input id="apin" type="password" name="password" inputmode="numeric" autocomplete="current-password" value="'+esc(bpAngel.pin)+'" oninput="bpAngel.pin=this.value"></div>'+

var SORTOPTS=[['day_desc','Today, high to low'],['day_asc','Today, low to high'],['value','Value now, high to low'],
  ['profit_desc','Profit, high to low'],['profit_asc','Profit, low to high'],['name','Name, A to Z']];

/* ---------- numbers and words ---------- */
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function n0(x){return Math.round(Math.abs(x)).toLocaleString('en-IN')}
function inr(x){return (x<-0.5?'−':'')+'₹'+n0(x)}
function sgn(x){return (x>0.5?'+':(x<-0.5?'−':''))+'₹'+n0(x)}
function px(x){return '₹'+Number(x).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}
function un(x){return Number(x).toLocaleString('en-IN',{maximumFractionDigits:3})}
function cls(x){return x>0.5?'up':(x<-0.5?'dn':'')}
function pc(a,b){return b>0?(Math.abs(a)/b*100).toFixed(1)+'%':''}
function col(x,base){return '<span class="'+cls(x)+'">'+sgn(x)+(base>0&&Math.abs(x)>0.5?' '+pc(x,base):'')+'</span>'}
function dt(s){if(!s)return '—';var p=s.split('-');return Number(p[2])+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][p[1]-1]+' '+p[0]}
function plural(n,w){return n+' '+w+(n===1?'':'s')}
function title(s){return s.disp||s.sym||s.name}
function master(){return !!(D&&D.role==='master')}
function istNow(){ var o={}; try{ new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Kolkata',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false,weekday:'short'}).formatToParts(new Date()).forEach(function(x){o[x.type]=x.value}); }catch(e){ return null; }
  return {ymd:o.year+'-'+o.month+'-'+o.day, hm:(Number(o.hour)%24)*60+Number(o.minute), dow:{Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6}[o.weekday]}; }
function mktText(){ var n=istNow(); if(!n) return ''; var hol=(D&&D.hol)||{};
  if(n.dow===6) return 'Market closed · Saturday'; if(n.dow===0) return 'Market closed · Sunday';
  if(hol[n.ymd]) return 'Market closed · Holiday, '+hol[n.ymd];
  if(n.hm<555) return 'Market closed · opens 9:15 am'; if(n.hm>=930) return 'Market closed for today'; return ''; }
function bellDot(){ var b=document.getElementById('bdot'); if(b) b.hidden=!(ALR&&ALR.items&&ALR.items.some(function(a){return a.up})); }
function mktBar(){ var el=document.getElementById('mkt'); if(!el) return; var t=D&&!D.error?mktText():''; el.textContent=t; el.hidden=!t; }
setInterval(function(){ if(!document.hidden) mktBar(); },60000);

function tag(s){if(s.inactive)return '<span class="tag">Inactive, at cost</span>';return s.status==='none'?'<span class="tag">No live price</span>':(s.status==='manual'?'<span class="tag">Manual price</span>':'')}
function accName(i){var a=D.accounts[i];return a.label||a.name}
function capIn(x){return Math.max(0,x.bought-x.sold)}
function extraOut(x){return Math.max(0,x.sold-x.bought)}
function rate(x){return x==null?'':'<span class="'+(x>0?'up':(x<0?'dn':''))+'">'+(x>0?'+':(x<0?'−':''))+Math.abs(x*100).toFixed(1)+'%</span>'}
function retPc(x,base){return base>0.5?(x<0?'−':'')+pc(x,base)+' return':''}

/* ---------- data ---------- */
var busy=false;
var forceNext=false;
function url_(cb){ var f=forceNext; forceNext=false; return ENDPOINT+'?json=1&k='+encodeURIComponent(KEY)+(f?'&fresh=1':'')+(cb?'&cb='+cb:'')+'&t='+Date.now() }
function fail(msg){
  busy=false;
  document.getElementById('refresh').classList.remove('spin');
  document.getElementById('when').textContent='Not updated';
  if(!D) document.getElementById('main').innerHTML='<div class="center">'+esc(msg)+'</div>';
}
function load(force,quiet){
  if(busy) return;
  if(force){ forceNext=true; if(!quiet) ipoForce=true; }
  if(!KEY){ D={error:'This app is not linked to your portfolio yet.',
    fix:'Open your personal dashboard link once in Safari. It ends with ?k= and a long code. Then add it to the Home Screen again.'}; done(); return; }
  busy=true;
  document.getElementById('refresh').classList.add('spin');
  if(typeof fetch==='function'){
    fetch(url_(''),{redirect:'follow',cache:'no-store'})
      .then(function(r){ return r.text() })
      .then(function(t){ busy=false; D=JSON.parse(t); done(); })
      .catch(function(){ busy=false; jsonp(); });
  } else { jsonp(); }
}
function jsonp(){
  if(busy) return;
  busy=true;
  document.getElementById('refresh').classList.add('spin');
  var cb='pf'+Date.now(), s=document.createElement('script'), timer;
  function clean(){ try{ if(s.parentNode) s.parentNode.removeChild(s); delete window[cb]; }catch(e){} clearTimeout(timer) }
  window[cb]=function(o){ busy=false; D=o; clean(); done(); };
  s.src=url_(cb);
  s.onerror=function(){ clean(); fail('Could not reach your portfolio. Check your connection and tap the refresh button.') };
  timer=setTimeout(function(){ if(window[cb]){ clean(); fail('Your portfolio took too long to answer. Tap the refresh button to try again.') } },60000);
  document.head.appendChild(s);
}
function done(){ loadedAt=Date.now(); busy=false; document.getElementById('refresh').classList.remove('spin');
  try{ if(!D.error&&!D.demo&&D.stocks&&KEY) localStorage.setItem('pfd_'+KEY,JSON.stringify(D)); }catch(e){}
  if(!D.error&&(!D.accounts||sel>=D.accounts.length)) sel=-1;
  if(!D.error&&stock>=0&&(!D.stocks||stock>=D.stocks.length)) stock=-1;
  render(); reval(); }
var revalBusy=false;
function reval(){ if(D&&D.gen&&!D.demo&&!revalBusy&&Date.now()-D.gen>75000){ revalBusy=true; setTimeout(function(){ revalBusy=false; load(true,true) },400); } }
document.addEventListener('visibilitychange',function(){ if(!document.hidden&&Date.now()-loadedAt>30000) load(); });

function scope(){
  if(sel<0) return {t:D.totals,label:'All accounts',tx:D.txns,
    lines:D.stocks.map(function(s,i){return {s:i,units:s.units,avg:s.avg,cost:s.cost,mv:s.mv,unreal:s.unreal,
      realised:s.realised,costSold:s.costSold,day:s.day,net:s.net,bought:s.bought,sold:s.sold}})};
  var a=D.accounts[sel];
  return {t:a.t,label:accName(sel),lines:a.lines,tx:D.txns.filter(function(r){return r[5]===sel})};

var moreIO=null;
function autoMore(){ try{ if(moreIO){ moreIO.disconnect(); moreIO=null; } var b=document.querySelector('button.more[onclick="more()"]'); if(!b||!window.IntersectionObserver) return;
  moreIO=new IntersectionObserver(function(es){ if(es[0].isIntersecting){ moreIO.disconnect(); moreIO=null; more(); } },{rootMargin:'400px'}); moreIO.observe(b); }catch(e){} }

/* ---------- sorting ---------- */
function visible(lines){
  if(!q) return lines;
  return lines.filter(function(l){var s=D.stocks[l.s];return (title(s)+' '+s.sym+' '+s.name).toLowerCase().indexOf(q)>=0});
}
function sortLines(arr){
  var f={
    value:function(a,b){return b.mv-a.mv},
    name:function(a,b){var x=title(D.stocks[a.s]).toUpperCase(),y=title(D.stocks[b.s]).toUpperCase();return x<y?-1:(x>y?1:0)},
    profit_desc:function(a,b){return (b.realised+b.unreal)-(a.realised+a.unreal)},
    profit_asc:function(a,b){return (a.realised+a.unreal)-(b.realised+b.unreal)},
    day_desc:function(a,b){return b.day-a.day},
    day_asc:function(a,b){return a.day-b.day}
  }[sortKey]||function(a,b){return b.day-a.day};
  var out=arr.slice().sort(f);
  return out.filter(function(l){return !D.stocks[l.s].inactive}).concat(out.filter(function(l){return D.stocks[l.s].inactive}));
}
function tools(ph){
  return '<div class="tools"><select onchange="setSort(this.value)" aria-label="Sort by">'+
    SORTOPTS.map(function(o){return '<option value="'+o[0]+'"'+(sortKey===o[0]?' selected':'')+'>'+o[1]+'</option>'}).join('')+
    '</select><input class="srch" type="search" placeholder="'+ph+'" value="'+esc(q)+'" oninput="search(this.value)"></div>';
}
function tail(n,shown){ return n>shown?'<button class="more" onclick="more()">Show more ('+(n-shown)+' left)</button>':'' }
function acctSelect(){
  if(!D.accounts||D.accounts.length<2) return '';
  return '<select onchange="pick(Number(this.value))" aria-label="Account">'+
    '<option value="-1"'+(sel<0?' selected':'')+'>All accounts</option>'+
    D.accounts.map(function(a,i){return '<option value="'+i+'"'+(sel===i?' selected':'')+'>'+esc(accName(i))+'</option>'}).join('')+
    '</select>';
}
function scopeBar(){
  if(sel<0) return '';
  return '<div class="scope"><span>Showing <b>'+esc(accName(sel))+'</b> only</span>'+
    '<button onclick="pick(-1)">Show all accounts</button></div>';
}

/* ---------- the money card ---------- */
function moneyCard(t){
  var capital=capIn(t), extra=extraOut(t), total=t.realised+t.unreal;
  var h='<div class="ml"><div class="k">Invested value</div><div class="v">'+inr(t.cost)+'</div></div>'+
    '<div class="ml"><div class="k">Net capital still in</div>'+
    '<div class="v '+(capital>0.5?'cap-red':'up')+'">'+(capital>0.5?inr(capital):'Nothing, all back')+'</div></div>'+
    '<div class="ml"><div class="k">Profit booked</div><div class="v">'+col(t.realised)+'</div></div>'+
    '<div class="ml"><div class="k">Unrealised profit</div><div class="v">'+col(t.unreal)+'</div></div>'+
    '<div class="ml total"><div class="k">Total profit</div>'+
    '<div class="v '+cls(total)+'">'+sgn(total)+(t.cost>0.5?'<span class="pcline">'+retPc(total,t.cost)+'</span>':'')+'</div></div>';
  if(t.xirr!=null) h+='<div class="ml"><div class="k">Return a year</div><div class="v">'+rate(t.xirr)+'</div></div>';
  var banner = extra>0.5 ? '<div class="banner"><div>All capital recovered.<b>Extra profit taken out: '+inr(extra)+'</b></div></div>' : '';
  return banner+'<div class="card">'+h+'</div>';
}

/* ---------- rows ---------- */
function gainPc(l){ return l.cost>0.5?' ('+(l.unreal<0?'−':'+')+pc(l.unreal,l.cost)+')':'' }
function dayPc(l,s){ var prev=l.mv-l.day; return prev>0?' ('+(l.day<-0.5?'−':'+')+pc(l.day,prev)+')':'' }
function holdingRow(l){
  var s=D.stocks[l.s], live=s.status!=='none';
  var head='<div class="head"><div class="nm"><div class="t">'+esc(title(s))+tag(s)+'</div>'+
    (detail?'':'<div class="s">'+un(l.units)+' × '+px(l.avg)+'</div>')+'</div>'+
    '<div class="vv"><div class="t">'+inr(l.mv)+'<span class="'+cls(l.unreal)+'" style="font-size:13.5px;font-weight:700">'+gainPc(l)+'</span></div>'+
    (detail?'':'<div class="s '+cls(l.day)+'" style="font-weight:700">'+(live?sgn(l.day)+dayPc(l,s):'—')+'</div>')+
    '</div></div>';
  if(!detail) return '<button class="item" onclick="openStock('+l.s+')">'+head+'</button>';
  return '<button class="item" onclick="openStock('+l.s+')">'+head+
    '<div class="drow"><span>Avg cost '+px(l.avg)+'</span><b>'+(live?'Price '+px(s.price):'No live price')+'</b></div>'+
    '<div class="drow"><span>Units '+un(l.units)+'</span><b class="'+cls(l.day)+'">'+(live?'Today '+sgn(l.day)+dayPc(l,s):'—')+'</b></div>'+
    '<div class="drow dsep"><span>Invested '+inr(l.cost)+'</span><b class="'+cls(l.unreal)+'">Unrealised '+sgn(l.unreal)+'</b></div>'+
    '</button>';
}
function profitRow(l){
  var s=D.stocks[l.s], total=l.realised+l.unreal, extra=extraOut(l), capital=capIn(l);
  var sub = l.units>0 ? plural(un(l.units),'share')+' held' : 'Fully sold';
  return '<button class="item" onclick="openStock('+l.s+')">'+
    '<div class="head"><div class="nm"><div class="t">'+esc(title(s))+tag(s)+'</div><div class="s">'+sub+'</div></div>'+
    '<div class="vv"><div class="t '+cls(total)+'">'+sgn(total)+'</div><div class="s">'+(retPc(total,l.bought)||'total profit')+'</div></div></div>'+
    '<div class="mini"><div><span>Invested</span><b>'+inr(l.bought)+'</b></div>'+
    '<div><span>Withdrawn</span><b>'+inr(l.sold)+'</b></div>'+
    '<div><span>Value now</span><b>'+(l.units>0?inr(l.mv):'₹0')+'</b></div></div>'+
    (extra>0.5?'<span class="flag">No capital left in · '+inr(extra)+' taken out</span>':
      (capital>0.5?'<span class="flag" style="background:var(--loss-bg);color:var(--loss)">Capital still in: '+inr(capital)+'</span>':''))+
    '</button>';
}
function accountRow(a,i){
  var capital=capIn(a.t), total=a.t.realised+a.t.unreal;
  return '<button class="item" onclick="pickTab('+i+')">'+
    '<div class="head"><div class="nm"><div class="t">'+esc(accName(i))+'</div>'+
    '<div class="s">'+plural(a.lines.filter(function(l){return l.units>0}).length,'holding')+'</div></div>'+
    '<div class="vv"><div class="t">'+inr(a.t.mv)+'</div><div class="s">value now</div></div></div>'+
    '<div class="mini"><div><span>Capital in now</span><b class="'+(capital>0.5?'cap-red':'up')+'">'+(capital>0.5?inr(capital):'All back')+'</b></div>'+
    '<div><span>Invested value</span><b>'+inr(a.t.cost)+'</b></div>'+
    '<div><span>Total profit</span><b class="'+cls(total)+'">'+sgn(total)+'</b></div></div>'+
    '</button>';
}
function holdingList(){
  var all=sortLines(visible(scope().lines.filter(function(l){return l.units>0})));
  if(!all.length) return '<div class="empty">'+(q?'No holding matches that search.':'Nothing is held here now.')+'</div>';
  var rows='',head=false;
  all.slice(0,limit).forEach(function(l){if(D.stocks[l.s].inactive&&!head){rows+='<div class="inact">Inactive: delisted or not traded. Held at cost.</div>';head=true}rows+=holdingRow(l)});
  return '<div class="list">'+rows+'</div>'+tail(all.length,limit);
}
function profitList(){
  var all=sortLines(visible(scope().lines));
  if(!all.length) return '<div class="empty">No stock matches that search.</div>';
  return '<div class="list">'+all.slice(0,limit).map(profitRow).join('')+'</div>'+tail(all.length,limit);
}
function txList(tx,showAcc){
  if(q) tx=tx.filter(function(r){var s=D.stocks[r[1]];return (title(s)+' '+s.name+' '+accName(r[5])).toLowerCase().indexOf(q)>=0});
  if(!tx.length) return '<div class="empty">No transactions to show.</div>';
  var h='<div class="txwrap">';

       '<div class="s"><span class="'+(sell?'sell':'buy')+'">'+(sell?'Sell':'Buy')+'</span>'+un(r[3])+' × '+px(r[4])+'</div></div>'+
       '<div class="txr"><div class="t '+(sell?'up':'')+'">'+(sell?'+':'−')+'₹'+n0(r[6])+'</div>'+
       '<div class="s">'+dt(r[0])+(showAcc?' · '+esc(accName(r[5])):'')+'</div></div></div>';
  });
  return h+'</div>'+tail(tx.length,limit);
}

var FORM=null, fOpen=false, fStep=1, fErr='', fOk='', fBusy=false, fDup=false;

function qs_(o){ return Object.keys(o).map(function(k){ return k+'='+encodeURIComponent(o[k]) }).join('&') }
function api(params, cb){
  var done=false;
  params.k=KEY; params.t=Date.now();
  if(typeof fetch==='function'){
    fetch(ENDPOINT+'?'+qs_(params),{redirect:'follow',cache:'no-store'})
      .then(function(r){ return r.text() })
      .then(function(x){ if(done)return; done=true; cb(JSON.parse(x)); })
      .catch(function(){ if(done)return; done=true; apiJsonp(params,cb); });
  } else apiJsonp(params,cb);
}
function apiJsonp(params, cb){
  var nm='af'+Date.now(), sc=document.createElement('script');
  function clean(){ try{ sc.parentNode.removeChild(sc) }catch(e){} try{ delete window[nm] }catch(e){} }
  window[nm]=function(o){ clean(); cb(o); };
  params.cb=nm;
  sc.src=ENDPOINT+'?'+qs_(params);
  sc.onerror=function(){ clean(); cb({ok:false,error:'Could not reach the sheet. Check your connection.'}); };
  document.head.appendChild(sc);
}
function today_(){ var d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2) }
function openAdd(){

  SUG=[]; sugBusy=false; sugQ='';

function fset(k,v){ fv[k]=v; if(k==='account'||k==='side'){ fv.stock=''; fv.ticker=''; fv.code=''; SUG=[]; } fErr=''; fDup=false; paintSheet(); }
function stockInput(v){
  fv.stock=v; fv.ticker=''; fv.code='';

function paintSug(){

function pickSug(i){ var x=SUG[i]; if(!x) return; fv.stock=x.name; fv.ticker=x.sym; fv.code=x.code; SUG=[]; sugQ=''; paintSheet(); }
function fback(){ fStep=1; fErr=''; paintSheet(); }
function heldList(){ return (FORM&&FORM.holdings&&FORM.holdings[fv.account])||[] }
function pickedHold(){ var l=heldList(); for(var i=0;i<l.length;i++) if(l[i].name===fv.stock) return l[i]; return null }
function fAmount(){ var q=Number(fv.qty),p=Number(fv.price); return (q>0&&p>=0)?q*p:0 }

function fGo(){
  fErr='';
  if(!fv.account){ fErr='Choose an account.'; return paintSheet(); }
  if(!fv.stock){ fErr='Choose or type a stock.'; return paintSheet(); }
  if(!(Number(fv.qty)>0)){ fErr='Enter a quantity greater than zero.'; return paintSheet(); }
  if(!(Number(fv.price)>=0)){ fErr='Enter a valid price.'; return paintSheet(); }
  if(!fv.date){ fErr='Choose a date.'; return paintSheet(); }
  if(fv.side==='Sell'){
    var h=pickedHold();
    if(!h){ fErr='Choose a stock held in that account.'; return paintSheet(); }
    if(Number(fv.qty)>h.units+0.0001){ fErr='You hold only '+un(h.units)+'. Reduce the quantity.'; return paintSheet(); }
  }
  fStep=2; paintSheet();

function fSave(force){
  if(fBusy) return;
  fBusy=true; fErr=''; paintSheet();
  var h=pickedHold();
  api({action:'add',side:fv.side,account:fv.account,stock:fv.stock,
       ticker:(fv.side==='Sell'&&h?(h.sym||''):(fv.ticker||'')),
       code:(fv.side==='Sell'?'':(fv.code||'')),
       qty:fv.qty,price:fv.price,date:fv.date,
       purpose:(fv.side==='Sell'&&h?h.purpose:fv.purpose), force:force?'1':''},
    function(o){
      fBusy=false;
      if(o&&o.ok){ fOk='Saved. '+fv.side+' '+un(Number(fv.qty))+' recorded in '+fv.account+'.';
        fStep=3; FORM=null; paintSheet(); load(); }
      else { fErr=(o&&o.error)||'Could not save.'; fDup=!!(o&&o.duplicate); fStep=2; paintSheet(); }
    });

function fDelete(id){

    ipoTile('Cost of shares held',inr(s.cost),'Net capital in '+(s.cap-s.wd>0?inr(s.cap-s.wd):'nothing, all back'))+
    ipoTile('Profit booked',sgn(s.real),'',cls(s.real))+
    ipoTile('Unrealised profit',sgn(s.unr),'',cls(s.unr))+
    ipoTile('Annual return (XIRR)',xr(s.x),'',s.x==null?'':'up')+
    ipoTile('Winners and losers',s.win+' / '+s.lose,'IPOs in profit / in loss')+
  '</div>';
}
function ipoBars(v){
  var ys=v.y.slice(); if(!ys.length) return '';
  var m1=0,m2=0; ys.forEach(function(y){ m1=Math.max(m1,Math.abs(y.tot)); m2=Math.max(m2,Math.abs(y.net),Math.abs(y.val)); });
  var c1=ys.map(function(y){ var w=m1>0?Math.max(2,Math.abs(y.tot)/m1*100):0;
    return '<div class="ibar"><span class="by">'+esc(y.y)+'</span><div class="bt"><i class="'+(y.tot>=0?'ibg':'ibr')+'" style="width:'+w.toFixed(1)+'%"></i></div><b class="bv '+cls(y.tot)+'">'+sgn(y.tot)+'</b></div>'; }).join('');
  var c2=ys.map(function(y){
    var w1=m2>0?Math.max(2,Math.abs(y.net)/m2*100):0, w2=m2>0?Math.max(2,Math.abs(y.val)/m2*100):0;
    return '<div class="ibar two"><span class="by">'+esc(y.y)+'</span><div class="bt"><i class="'+(y.net>0?'ibi':'ibn')+'" style="width:'+w1.toFixed(1)+'%"></i></div><b class="bv">'+(y.net<0?'−':'')+'₹'+n0(y.net)+'</b></div>'+
      '<div class="ibar two" style="margin-bottom:10px"><span></span><div class="bt"><i class="ibg" style="width:'+w2.toFixed(1)+'%"></i></div><b class="bv">'+inr(y.val)+'</b></div>'; }).join('');
  return '<h2>Profit each year</h2><div class="card" style="padding:10px 16px">'+c1+'</div>'+
    '<h2>Money still in vs value now <small>each year</small></h2><div class="card" style="padding:10px 16px">'+
    '<div class="ileg"><span><b class="ibi"></b>Net money still in</span><span><b class="ibg"></b>Value of shares now</span></div>'+
    '<div style="font-size:11.5px;color:var(--mute);margin-bottom:6px">Grey means more was taken out by selling than was put in.</div>'+c2+'</div>';
}
function ipoStockRow(s,showYear){
  var pcs=s.c>0.5?' ('+rp(s.u/s.c)+')':'';
  return '<div class="isr"><div class="l"><div class="t">'+esc(s.n)+(s.f?'<span class="inp">No live price</span>':'')+'</div>'+
    '<div class="s">'+(s.h>0?un(s.h)+' × '+px(s.g)+' · now '+(s.p>0?px(s.p):'no price')+(s.a?' · '+esc(s.a):''):'Sold out · bought at '+px(s.g))+'</div>'+
    '<div class="s">Booked <span class="'+cls(s.r)+'">'+sgn(s.r)+'</span> · Unrealised <span class="'+cls(s.u)+'">'+sgn(s.u)+'</span></div></div>'+
    '<div class="r"><div class="t">'+(s.h>0?inr(s.v):'—')+'</div><div class="s '+cls(s.t)+'">'+sgn(s.t)+'</div></div></div>';
}
function ipoYearCard(y){
  var open=ipoYear!==''||ipoOpen[y.y];
  var ml=function(k,v){return '<div class="ml"><div class="k">'+k+'</div><div class="v" style="font-size:16px">'+v+'</div></div>'};
  return '<details class="iy"'+(open?' open':'')+' ontoggle="ipoOpen[\''+y.y+'\']=this.open"><summary><div><div class="yt">'+esc(y.y)+'</div>'+
    '<div class="ys">'+plural(y.n,'IPO')+' · '+plural(y.a,'allotment')+'</div></div>'+
    '<div class="yp '+cls(y.tot)+'">'+sgn(y.tot)+'<small>'+(y.ret!=null?rp(y.ret)+' · ':'')+xr(y.x)+' a year</small></div></summary>'+
    '<div class="yb">'+ml('Capital deployed',inr(y.cap))+ml('Proceeds from sales',inr(y.wd))+
    ml('Capital still in',(y.net<0?'−':'')+'₹'+n0(y.net))+ml('Value of shares still held',inr(y.val))+
    ml('Profit booked','<span class="'+cls(y.real)+'">'+sgn(y.real)+'</span>')+ml('Unrealised profit','<span class="'+cls(y.unr)+'">'+sgn(y.unr)+'</span>')+
    ml('Total profit','<span class="'+cls(y.tot)+'">'+sgn(y.tot)+'</span>')+ml('Annual return (XIRR)',xr(y.x))+
    '<div style="margin-top:6px;font-weight:800;font-size:13px;color:var(--mute)">Stock by stock</div>'+y.st.map(function(s){return ipoStockRow(s)}).join('')+'</div></details>';
}
function ipoHoldings(ys){
  var L=[]; ys.forEach(function(y){ y.st.forEach(function(s){ if(s.h>0) L.push(s) }) });
  var pc2=function(s){return s.c>0?s.u/s.c:0};
  L.sort(function(a,b){
    if(ipoSort==='profit') return b.u-a.u; if(ipoSort==='loss') return a.u-b.u;
    if(ipoSort==='pct') return pc2(b)-pc2(a); if(ipoSort==='name') return a.n<b.n?-1:1; return b.v-a.v; });
  var tv=0,tu=0,tc=0; L.forEach(function(s){tv+=s.v;tu+=s.u;tc+=s.c});
  var sel='<select class="isel" onchange="ipoSetS(this.value)">'+IPOSORT.map(function(o){return '<option value="'+o[0]+'"'+(o[0]===ipoSort?' selected':'')+'>'+o[1]+'</option>'}).join('')+'</select>';
  return '<h2>IPOs still held <small>'+plural(L.length,'stock')+'</small></h2>'+
    '<div class="tools">'+sel+'</div>'+
    (L.length?'<div class="card" style="padding:4px 16px"><div class="isr" style="border-top:0"><div class="l"><div class="t">All of these</div><div class="s">Cost '+inr(tc)+'</div></div><div class="r"><div class="t">'+inr(tv)+'</div><div class="s '+cls(tu)+'">'+sgn(tu)+(tc>0.5?' ('+rp(tu/tc)+')':'')+'</div></div></div>'+
      L.map(function(s){return ipoStockRow(s)}).join('')+'</div>':'<div class="note">Nothing from this selection is still held.</div>');
}
function ipoDiag(){
  var d=IPO.diag||{}, bad=[];
  if(d.noPurpose) bad.push(plural(d.noPurpose,'IPO row')+' with no Purpose (still counted, because the stock has an IPO Allotment row)');
  if(d.text) bad.push(plural(d.text,'amount')+' stored as text, so the sheet totals skip them');
  if(d.noPrice&&d.noPrice.length) bad.push(d.noPrice.length+' without a live price, counted at cost: '+d.noPrice.map(esc).join(', '));
  if(d.noCode) bad.push(plural(d.noCode,'row')+' with no ticker code');
  if(d.ledgerRows>4500) bad.push('the Ledger has '+d.ledgerRows+' rows, close to the 5000 the IPO sheet reads');
  return bad.length?'<div class="idiag warn">To check: '+bad.join('; ')+'.</div>':'';
}
function ipoScreen(){
  var main=document.getElementById('main');
  document.getElementById('band').innerHTML=''; document.getElementById('fab').innerHTML='';
  if(!IPO){ try{ var c=localStorage.getItem('ipo_'+KEY); if(c) IPO=JSON.parse(c); }catch(e){} }
  if(ipoStale&&!ipoBusy){ ipoStale=false; ipoLoad(); }
  if(!IPO){ main.innerHTML=ipoErr?'<div class="card" style="margin-top:22px;padding:16px;font-weight:700">'+esc(ipoErr)+'</div>':'<div class="center">Loading IPO figures</div>'; return; }
  if(ipoAcct!=='ALL'&&IPO.accounts.indexOf(ipoAcct)<0) ipoAcct='ALL';
  var v=ipoView(), ys=ipoYears(v), s=ipoSum(v);
  var m='<div class="idiag" style="margin-top:12px">IPO figures, master only. Updated '+esc(IPO.asOf||'')+(IPO.priceNote?'. '+esc(IPO.priceNote):'')+(ipoBusy?'. Refreshing...':'')+'</div>'+
    (ipoErr?'<div class="note">'+esc(ipoErr)+'</div>':'')+ipoChips()+ipoCards(s)+(ipoYear===''?ipoBars(v):'')+
    '<h2>Year by year <small>tap a year</small></h2>'+(ys.length?ys.map(ipoYearCard).join(''):'<div class="note">No IPOs in this selection.</div>')+
    ipoHoldings(ys)+ipoDiag();
  main.innerHTML=m;
}

try{ var _c=KEY&&localStorage.getItem('pfd_'+KEY); if(_c){ D=JSON.parse(_c); if(D&&!D.error&&D.stocks) done(); else D=null; } }catch(e){ D=null; }

/* ---------- Alerts: dividends, splits, bonus and other actions on your holdings; master also sees phone-push setup ---------- */
var ALR=null, alrBusy=false, alrStale=true, alrErr='', alrNote='';
function alertsLoad(fresh){
  if(alrBusy) return; alrBusy=true;
  if(isDemo()){ alrBusy=false; ALR={ok:true,src:'Demo',items:[]}; if(tab==='alerts'&&stock<0) alertsScreen(); return; }
  bcall('alertsData',[fresh?1:0],fresh?{action:'alerts',fresh:1}:{action:'alerts'},function(o){
    alrBusy=false;
    if(!o||o.error||!o.items){ alrErr=(o&&o.error)||'Could not load alerts. Pull to refresh or try again.'; }
    else { alrErr=''; ALR=o; try{ localStorage.setItem('alr_'+KEY,JSON.stringify(o)); }catch(e){} }
    bellDot();
    if(tab==='alerts'&&stock<0&&!typing()) alertsScreen();
  });
}
function alrAgo(ms){ if(!ms) return ''; var m=Math.round((Date.now()-ms)/60000); if(m<1) return 'just now'; if(m<60) return m+' min ago'; var h=Math.round(m/60); if(h<24) return h+' h ago'; return Math.round(h/24)+' days ago'; }
function alrPushTest(){ alrNote='Sending...'; alertsScreen(); bcall('pushTest',[],{action:'pushtest'},function(r){ alrNote=r&&r.ok?'Test sent. It should reach your phone in a few seconds.':((r&&r.error)||'Could not send.'); alertsScreen(); }); }
function alrCopy(t){ try{ navigator.clipboard.writeText(t); alrNote='Copied: '+t; }catch(e){ alrNote='Topic: '+t; } alertsScreen(); }
function alrRow(a){
  var tone=a.type==='Dividend'?'g':(a.type==='Other'?'':'m');
  return '<div class="isr"><div class="l"><div class="t">'+esc(a.name)+'<span class="inp">'+esc(a.type)+'</span></div>'+
    '<div class="s">'+esc(a.subject)+'</div>'+
    '<div class="s">You hold '+un(a.units)+' shares'+(a.est?' · about '+inr(a.est):'')+'</div></div>'+
    '<div class="r"><div class="t" style="font-size:13px">'+(a.up?'Ex-date':'Went ex')+'</div><div class="s">'+esc(dt(a.ex))+'</div></div></div>';
}
function alertsScreen(){
  var main=document.getElementById('main');
  document.getElementById('band').innerHTML=''; document.getElementById('fab').innerHTML='';
  if(!ALR){ try{ var c=localStorage.getItem('alr_'+KEY); if(c) ALR=JSON.parse(c); }catch(e){} }
  if(alrStale&&!alrBusy){ alrStale=false; alertsLoad(); }
  if(!ALR){ main.innerHTML=alrErr?'<div class="card" style="margin-top:22px;padding:16px;font-weight:700">'+esc(alrErr)+'</div>':'<div class="center">Loading alerts</div>'; return; }
  var m='<div class="idiag" style="margin-top:12px">Dividends, splits, bonus issues and other actions on shares you hold. '+(ALR.at?'Checked '+alrAgo(ALR.at)+'. ':'')+(alrBusy?'Refreshing...':'')+'</div>';
  if(alrErr) m+='<div class="note">'+esc(alrErr)+'</div>';
  var up=ALR.items.filter(function(a){return a.up}), past=ALR.items.filter(function(a){return !a.up});
  m+='<h2>Coming up <small>'+plural(up.length,'action')+'</small></h2>'+(up.length?'<div class="card" style="padding:4px 16px">'+up.map(alrRow).join('')+'</div>':'<div class="note">Nothing announced for your holdings.</div>');
  if(past.length) m+='<h2>Recent <small>'+plural(past.length,'action')+'</small></h2><div class="card" style="padding:4px 16px">'+past.slice(0,20).map(alrRow).join('')+'</div>';
  var S=ALR.sys;
  if(S){
    m+='<h2>Phone alerts <small>master only</small></h2><div class="card" style="padding:12px 16px">'+
      '<div style="font-weight:700;font-size:14px;line-height:1.5">You get a summary after the market closes and a note when a dividend, split or bonus is announced on your shares, even when the app is closed.</div>'+
      '<div class="s" style="margin-top:8px;font-size:13px;color:var(--mute);font-weight:600;line-height:1.55">1. Install the free app <b>ntfy</b> (App Store or Play Store).<br>2. In ntfy tap +, choose Subscribe to topic, and enter:</div>'+
      '<div style="margin:8px 0;font-weight:800;font-size:15px;word-break:break-all">'+esc(S.topic)+'</div>'+
      '<div class="btnrow"><button class="btn ghost" onclick="alrCopy(\''+esc(S.topic)+'\')">Copy topic</button><button class="btn primary" onclick="alrPushTest()">Send test</button></div>'+
      (alrNote?'<div class="s" style="margin-top:8px;font-weight:700">'+esc(alrNote)+'</div>':'')+
      '<div class="s" style="margin-top:8px;font-size:12px;color:var(--mute);font-weight:600">Keep the topic private. Messages show day change and top movers only, never your total value.</div></div>';
    m+='<h2>Safety net <small>master only</small></h2><div class="card" style="padding:12px 16px;font-size:13.5px;font-weight:600;line-height:1.7">'+
      'Backup: '+(S.backup?esc(alrAgo(S.backup.at))+' · '+esc(S.backup.name)+'. Newest '+S.backup.kept+' kept in your Drive folder, every 2 days.':'not run yet')+'<br>'+
      'Data refresh in background: '+(S.warm?'last ran '+esc(alrAgo(S.warm.at)):'not run yet')+'</div>';
    if(S.log&&S.log.length) m+='<h2>Recent notifications</h2><div class="card" style="padding:4px 16px">'+S.log.slice(0,8).map(function(e){return '<div class="isr"><div class="l"><div class="t">'+esc(e.title)+'</div><div class="s" style="white-space:pre-line">'+esc(e.msg)+'</div></div><div class="r"><div class="s">'+esc(alrAgo(e.at))+'</div></div></div>'}).join('')+'</div>';
  }
  main.innerHTML=m;
}
load();
</script>
